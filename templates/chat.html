<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support - WAWY</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="chat-container">

    <h1>🤖 WAWY AI Support</h1>
    <p class="subtitle">Tell me what's on your mind.</p>

    <form method="POST">

        <textarea
            name="message"
            placeholder="Type your feelings here..."
            required></textarea>

        <button type="submit">Send</button>

    </form>

    {% if reply %}
    <div class="ai-reply">
        <strong>🤖 WAWY AI</strong>
        <p>{{ reply }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
